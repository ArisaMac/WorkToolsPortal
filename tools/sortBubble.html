<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バブルソート・ビジュアライザー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/sortBubble.css">
</head>
<body class="bg-slate-50 text-slate-800">
    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900">バブルソート・ビジュアライザー</h1>
            <p class="mt-2 text-slate-600">「地道に隣同士を比べて、順番が逆なら入れ替える」</p>
        </header>

        <main>
            <!-- 解説表示エリア -->
            <div id="explanation-box" class="explanation-box bg-white p-6 rounded-lg shadow-lg border border-slate-200 mb-6 flex items-center justify-center">
                <p id="explanation-text" class="text-slate-700 text-center">「ソート開始」または「チュートリアル」ボタンを押して開始してください。</p>
            </div>

            <!-- ビジュアライザー表示エリア -->
            <div id="visualizer" class="visualizer-container mb-6">
                 <!-- ソート中コントロールパネル -->
                <div id="sorting-controls" class="hidden absolute bottom-4 right-4 z-20 p-3 bg-white/70 backdrop-blur-sm rounded-lg shadow-lg flex items-center gap-4">
                    <button id="prev-step-btn" class="px-4 py-2 bg-gray-500 text-white font-semibold rounded-lg shadow-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-transform transform hover:scale-105">前のステップへ</button>
                    <button id="next-step-btn" class="px-4 py-2 bg-indigo-500 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-transform transform hover:scale-105">次のステップへ</button>
                    <button id="auto-play-btn" class="px-4 py-2 bg-teal-500 text-white font-semibold rounded-lg shadow-md hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-400 transition-transform transform hover:scale-105">自動再生</button>
                    <div class="flex items-center gap-2">
                         <label for="speed-slider" class="text-sm font-medium text-slate-600">速度:</label>
                         <input type="range" id="speed-slider" min="100" max="2000" value="1200" class="w-24 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- 操作ボタンエリア -->
            <div class="flex flex-wrap justify-center gap-3 mb-6">
                <button id="generate-btn" class="px-6 py-2 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-transform transform hover:scale-105">リセット/新規生成</button>
                <div id="initial-controls" class="flex flex-wrap justify-center gap-3">
                    <button id="sort-btn" class="px-6 py-2 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 transition-transform transform hover:scale-105">ソート開始</button>
                    <button id="tutorial-btn" class="px-6 py-2 bg-purple-500 text-white font-semibold rounded-lg shadow-md hover:bg-purple-600 focus:outline-none focus:ring-2 focus:ring-purple-400 transition-transform transform hover:scale-105">チュートリアル</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/sortBubble.js"></script>

</body>
</html>
